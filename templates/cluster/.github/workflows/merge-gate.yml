# This site's merge gate (README.md, "Merging safely"). Every node applies `main` within
# the pull interval and first runs a new kernel and initrd at its next reboot, so nothing
# reaches `main` unless the library's boot tests pass at THIS repository's flake.lock,
# which is what the nodes run, and every node's closure builds.
#
# Branch protection on `main`: require the status checks `merge-gate`, `boot-install`
# and `boot-fallback`, require branches to be up to date, and let no one bypass. avc
# needs no bypass: it opens a pull request for every change and never pushes `main`
# (README.md says what that costs). Then auto-merge, avc's and flake-update.yml's alike,
# waits for the checks and never merges a red run.
#
# Runs on a self-hosted runner with KVM (the boot tests are VMs that boot VMs' disks):
# Nix with flakes, a nix-daemon with `system-features = kvm nixos-test` (it runs the VMs; the
# runner unit's sandbox may hide /dev/kvm from the job itself), 16 GB of RAM. Each step
# below evaluates one thing in its own nix process and builds the .drv it printed, so no
# evaluation needs more than a few GB.
name: merge-gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The runner's own read access to this site's private flake inputs, as a nix.conf line:
  # "access-tokens = github.com=<token>". The runner is not a node: the nodes get theirs
  # from the cluster-ci Worker. Optional; leave the secret unset if every input is public
  # or in this repository.
  NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKENS }}

jobs:
  # The library's boot tests, as this lock resolves the library and its inputs
  # (flake.nix re-exports them). A nixpkgs, agenix, Lanzaboote or library bump that breaks
  # an encrypted node's boot fails here, before any node has it.
  boot-install:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.boot-install
        run: |
          nix config show system-features | grep -qw nixos-test
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.boot-install.drvPath)
          nix build --no-link --print-build-logs --max-jobs 1 "$drv^*"

  boot-fallback:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.boot-fallback
        run: |
          nix config show system-features | grep -qw nixos-test
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.boot-fallback.drvPath)
          nix build --no-link --print-build-logs --max-jobs 1 "$drv^*"

  # One Bedrock site booted by the wordpress kind, at this lock's wordpress-nix.
  wordpress-site-smoke:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.wordpress-site-smoke
        run: |
          nix config show system-features | grep -qw nixos-test
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.wordpress-site-smoke.drvPath)
          nix build --no-link --print-build-logs --max-jobs 1 "$drv^*"

  # Every project input follows the library's payload flake, with no nixpkgs of its own.
  project-inputs-follow:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.project-inputs-follow
        run: |
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.project-inputs-follow.drvPath)
          nix build --no-link --print-build-logs "$drv^*"

  # The boot tests prove the library's nixpkgs; the nodes build on this flake's. They are
  # the same store path only if one follows the other.
  nixpkgs-follows-library:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.nixpkgs-follows-library
        run: |
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.nixpkgs-follows-library.drvPath)
          nix build --no-link --print-build-logs "$drv^*"

  # github-repos.json says what the nodes may read at GitHub besides the lock's inputs,
  # and the cluster-ci Worker believes the committed file. It must be what the
  # configuration fetches: `avc ci repos` writes it.
  github-repos:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build checks.x86_64-linux.github-repos
        run: |
          drv=$(nix --option eval-cores 1 eval --raw .#checks.x86_64-linux.github-repos.drvPath)
          nix build --no-link --print-build-logs "$drv^*"

  nodes:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          names=$(nix --option eval-cores 1 eval --json .#nixosConfigurations --apply builtins.attrNames)
          test "$names" != "[]"
          echo "names=$names" >> "$GITHUB_OUTPUT"

  # Every node's closure, built: the build gates (the initrd's contents, the log label
  # contract) fail here instead of on the node, where they only stop the deploy.
  toplevel:
    needs: nodes
    name: toplevel (${{ matrix.node }})
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.nodes.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the node's system
        env:
          NODE: ${{ matrix.node }}
        run: |
          drv=$(nix --option eval-cores 1 eval --raw ".#nixosConfigurations.$NODE.config.system.build.toplevel.drvPath")
          nix build --no-link --print-build-logs --max-jobs 1 "$drv^*"

  merge-gate:
    needs: [boot-install, boot-fallback, wordpress-site-smoke, project-inputs-follow, nixpkgs-follows-library, github-repos, nodes, toplevel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        # Anything but success fails, a skipped or cancelled job included.
        run: |
          echo "$RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null || {
            echo "merge-gate: a job did not succeed (failed, cancelled or skipped)" >&2
            exit 1
          }
