# Which secrets `avc secrets rotate` may regenerate, and how (tools/avc/avc/core/policy.py).
# A generator no rule names is rotated freely, after a yes/no. The disk-bound and
# data-bound ones (luks, volume-identity, initrd-ssh, emergency-access, juicefs-rsa,
# restic) are refused by avc itself whatever this file says; most are listed here too, so
# the inventory explains them.

[defaults]
# The inventory marks a secret older than this.
max_age_days = 365

[[rule]]
match = "juicefs-rsa"
never = ["rsa.pem", "rsa-passphrase"]
reason = "The JuiceFS volume's key: the PEM is in the volume's metadata, encrypted with the passphrase. A new one means a new volume: the library's README, \"A node left your control\"."

[[rule]]
match = "restic"
never = ["password"]
reason = "Opens every app's restic repository; a new one opens none of them. Use `restic key add` and `restic key remove` per repository; after a lost node, the library's README, \"A node left your control\"."

[[rule]]
match = "juicefs-pg"
manual = true
reason = "The metadata role's password: every node's mount and the metadata node's role must change together. Rotate in a maintenance window."

[[rule]]
match = "luks"
never = ["passphrase"]
reason = "Each node's LUKS passphrase: the disks hold this one, and a new value opens nothing. Changing it means cryptsetup on the node, by hand."

[[rule]]
match = "volume-identity"
never = ["secret", "hash"]
reason = "Each node's volume identity: the signed initrd compares the secret on the root with this hash at every boot, and a new value halts the node."

[[rule]]
match = "nomad-ca"
manual = true
reason = "Reissues every machine's Nomad certificates at once: a hard cut for the whole cluster. topology.security.nomadTlsRotation reissues agent certificates alone."

[[rule]]
match = "nomad-jwt"
manual = true
reason = "Reissues every node's login JWTs; the leader's nomad-acl-init updates the auth method on its next switch. Deploy to the leader first."

[[rule]]
match = "wg-ctrl"
manual = true
reason = "A node's mesh key: it is cut off from each peer until that peer has deployed its new public key. Rotate one node at a time, and deploy every node."
